name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    services:
      # The suite runs against a real PostgreSQL rather than a stub: the money
      # paths are only meaningful if the transactions, row locks and
      # constraints are real.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: escrow
          POSTGRES_PASSWORD: escrow
          POSTGRES_DB: escrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escrow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://escrow:escrow@localhost:5432/escrow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # apps/* import the shared package from its build output, so it has to
      # exist before anything else is typechecked.
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build web
        run: npm run build --workspace=apps/web
